[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl-tty"
version = "0.2.0"
description = "Fix Persian/Arabic/Hebrew (RTL) text in the terminal for AI CLIs like Claude Code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["rtl", "bidi", "persian", "farsi", "arabic", "hebrew", "terminal", "pty", "vte"]
classifiers = ["Environment :: Console", "Operating System :: POSIX :: Linux", "License :: OSI Approved :: MIT License"]

[project.scripts]
rtl-tty = "rtl_tty.cli:main"

[tool.setuptools]
packages = ["rtl_tty"]
